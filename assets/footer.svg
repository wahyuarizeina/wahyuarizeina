<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Thanks for stopping by! Got a game idea, data with a story to tell, or a web product to build? Let's talk."><title>Thanks for stopping by! Got a game idea, data with a story to tell, or a web product to build? Let's talk.</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2');}
.float{animation:float 4s ease-in-out infinite}
.float2{animation:float 5s ease-in-out -2s infinite}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.twinkle2{animation:twinkle 3.2s ease-in-out -1.2s infinite}
.spin{animation:spin 26s linear infinite}
.blink{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(.72) rotate(20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

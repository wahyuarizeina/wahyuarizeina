<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Banuara — Situs resmi game petualangan berbasis cerita, lengkap dengan CMS untuk konten &amp; media."><title>Banuara — Situs resmi game petualangan berbasis cerita, lengkap dengan CMS untuk konten &amp; media.</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}

<svg xmlns="http://www.w3.org/2000/svg" width="394" height="80" viewBox="0 0 394 80" role="img" aria-label="05 — Jejak Kontribusi"><title>05 — Jejak Kontribusi</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}
.float{animation:float 4s ease-in-out infinite}
.float2{animation:float 5s ease-in-out -2s infinite}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.twinkle2{animation:twinkle 3.2s ease-in-out -1.2s infinite}
.spin{animation:spin 26s linear infinite}
.blink{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}

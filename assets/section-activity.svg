<svg xmlns="http://www.w3.org/2000/svg" width="366" height="80" viewBox="0 0 366 80" role="img" aria-label="04 — Contributions"><title>04 — Contributions</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}
.float{animation:float 4s ease-in-out infinite}

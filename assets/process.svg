ulkan data,</text><text x="279.0" y="178.0" font-family="sans" font-size="17" fill="#4a4a55" >rapikan &amp; eksplor</text></g><path d="M466.0,132 H492.0" stroke="#0e0e10" stroke-width="3" class="flow"/><path d="M486.0,125 L494.0,132 L486.0,139" fill="none" stroke="#0e0e10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="float"><rect x="505.0" y="46" width="196" height="170" rx="16" fill="#0e0e10"/><rect x="499.0" y="40" width="196" height="170" rx="16" fill="#fffdf5" stroke="#0e0e10" stroke-width="3" /><path d="M499.0,98 H695.0" stroke="#0e0e10" stroke-width="3"/><path d="M500.5,98 V56 a14.5,14.5 0 0 1 14.5,-14.5 H679.0 a14.5,14.5 0 0 1 14.5,14.5 V98Z" fill="#ff8fab"/><path d="M499.0,98 H695.0" stroke="#0e0e10" stroke-width="3"/><circle cx="529.0" cy="69" r="17" fill="#0e0e10"/><text x="529.0" y="75.0" font-family="monob" font-size="14" fill="#ffffff" text-anchor="middle" >03</text><text x="555.0" y="78.0" font-family="display" font-size="25" fill="#0e0e10" letter-spacing="-0.4" >Rancang</text><text x="517.0" y="138.0" font-family="sans" font-size="17" fill="#4a4a55" >Alur, UI &amp;</text><text x="517.0" y="164.0" font-family="sans" font-size="17" fill="#4a4a55" >skema database</text></g><path d="M704.0,132 H730.0" stroke="#0e0e10" stroke-width="3" class="flow"/><path d="M724.0,125 L732.0,132 L724.0,139" fill="none" stroke="#0e0e10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="float2"><rect x="743.0" y="60" width="196" height="170" rx="16" fill="#0e0e10"/><rect x="737.0" y="54" width="196" height="170" rx="16" fill="#fffdf5" stroke="#0e0e10" stroke-width="3" /><path d="M737.0,112 H933.0" stroke="#0e0e10" stroke-width="3"/><path d="M738.5,112 V70 a14.5,14.5 0 0 1 14.5,-14.5 H917.0 a14.5,14.5 0 0 1 14.5,14.5 V112Z" fill="#8ce99a"/><path d="M737.0,112 H933.0" stroke="#0e0e10" stroke-width="3"/><circle cx="767.0" cy="83" r="17" fill="#0e0e10"/><text x="767.0" y="89.0" font-family="monob" font-size="14" fill="#ffffff" text-anchor="middle" >04</text><text x="793.0" y="92.0" font-family="display" font-size="25" fill="#0e0e10" letter-spacing="-0.4" >Bangun</text><text x="755.0" y="152.0" font-family="sans" font-size="17" fill="#4a4a55" >Next.js, Supabase</text><text x="755.0" y="178.0" font-family="sans" font-size="17" fill="#4a4a55" >&amp; automasi</text></g><path d="M942.0,132 H968.0" stroke="#0e0e10" stroke-width="3" class="flow"/><path d="M962.0,125 L970.0,132 L962.0,139" fill="none" stroke="#0e0e10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="float"><rect x="981.0" y="46" width="196" height="170" rx="16" fill="#0e0e10"/><rect x="975.0" y="40" width="196" height="170" rx="16" fill="#fffdf5" stroke="#0e0e10" stroke-width="3" /><path d="M975.0,98 H1171.0" stroke="#0e0e10" stroke-width="3"/><path d="M976.5,98 V56 a14.5,14.5 0 0 1 14.5,-14.5 H1155.0 a14.5,14.5 0 0 1 14.5,14.5 V98Z" fill="#b197fc"/><path d="M975.0,98 H1171.0" stroke="#0e0e10" stroke-width="3"/><circle cx="1005.0" cy="69" r="17" fill="#0e0e10"/><text x="1005.0" y="75.0" font-family="monob" font-size="14" fill="#ffffff" text-anchor="middle" >05</text><text x="1031.0" y="78.0" font-family="display" font-size="25" fill="#0e0e10" letter-spacing="-0.4" >Ukur</text><text x="993.0" y="138.0" font-family="sans" font-size="17" fill="#4a4a55" >Uji, pantau metrik</text><text x="993.0" y="164.0" font-family="sans" font-size="17" fill="#4a4a55" >&amp; iterasi</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="372" height="80" viewBox="0 0 372 80" role="img" aria-label="02 — Proyek Pilihan"><title>02 — Proyek Pilihan</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}

<svg xmlns="http://www.w3.org/2000/svg" width="348" height="80" viewBox="0 0 348 80" role="img" aria-label="01 — Tentang Aku"><title>01 — Tentang Aku</title><style>@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}
